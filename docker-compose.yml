services:
  hermes:
    build: ./hermes
    # Without an explicit command, the container's foreground process
    # (Docker's CMD, NOT an s6-supervised service — see main-wrapper.sh's
    # routing comment in the Dockerfile) falls through to a bare `hermes`
    # invocation, which starts the interactive chat REPL. With no TTY
    # attached (any detached/compose run) it immediately hits "Input is
    # not a terminal", prints "Goodbye!", and exits 0 — which
    # `restart: unless-stopped` then dutifully restarts forever, recreating
    # the WHOLE container (control plane included) in a loop. `sleep
    # infinity` is upstream's own documented pattern for exactly this case
    # (see main-wrapper.sh's routing table); the actual long-lived work
    # (control plane, and later the gateway) runs as s6-supervised services
    # regardless of what the foreground process is doing.
    command: ["sleep", "infinity"]
    volumes:
      - ./data:/data
      # Bind-mounted (not COPYed into the image) so scripts/crawl_colleges.py
      # can be edited/re-run without a rebuild — matches HANDOVER.md §8's
      # "docker compose run hermes python scripts/crawl_colleges.py".
      - ./scripts:/opt/hermes/scripts
    environment:
      HERMES_HOME: /data/hermes-home
      CONTROL_TOKEN: ${CONTROL_TOKEN:?set CONTROL_TOKEN in .env}
      WEB_URL: http://web:3000
      CRM_INGEST_TOKEN: ${CRM_INGEST_TOKEN:?set CRM_INGEST_TOKEN in .env}
    restart: unless-stopped
    # Port 8300 is intentionally NOT published to the host — the control
    # plane is only reachable from the web container, over the compose
    # network. The operator talks to it through /hermes, not directly.

  web:
    build: ./web
    ports:
      - "${WEB_PORT:-3000}:3000"
    volumes:
      - ./data:/data
    environment:
      DATABASE_PATH: /data/crm.sqlite
      HERMES_CONTROL_URL: http://hermes:8300
      CONTROL_TOKEN: ${CONTROL_TOKEN:?set CONTROL_TOKEN in .env}
      CRM_INGEST_TOKEN: ${CRM_INGEST_TOKEN:?set CRM_INGEST_TOKEN in .env}
    restart: unless-stopped
    depends_on:
      - hermes
